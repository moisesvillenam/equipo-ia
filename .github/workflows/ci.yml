name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax
        run: bash -n equipo-ia.sh equipo-pruebas.sh bin/equipo install.sh demo.sh tests/run-tests.sh

      - name: ShellCheck
        run: shellcheck -S error equipo-ia.sh equipo-pruebas.sh bin/equipo install.sh demo.sh tests/run-tests.sh

      - name: Tests
        run: ./tests/run-tests.sh

      - name: Secret scan
        run: ./tests/check-secrets.sh

      - name: Demo
        run: ./demo.sh
