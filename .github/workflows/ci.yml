name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax
        run: |
          for script in equipo-ia.sh equipo-pruebas.sh equipo-publicar.sh bin/equipo install.sh demo.sh tests/run-tests.sh; do
            bash -n "$script" || exit 1
          done

      - name: ShellCheck
        run: shellcheck -S error equipo-ia.sh equipo-pruebas.sh equipo-publicar.sh bin/equipo install.sh demo.sh tests/run-tests.sh

      - name: Tests
        run: ./tests/run-tests.sh

      - name: Publication tests (local Git remotes)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Secret scan
        run: ./tests/check-secrets.sh

      - name: Demo
        run: ./demo.sh

      - name: Windows bridge tests (Linux engine)
        run: python3 -m unittest discover -s desktop -p 'test_*.py' -v

      - name: Desktop shell adapters
        run: |
          bash -n desktop/setup.sh desktop/revisor-codex.sh
          shellcheck -S error desktop/setup.sh desktop/revisor-codex.sh

      - name: Package Windows preview
        run: python3 desktop/package_windows.py

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Equipo-IA-Windows-v4.5.0
          path: dist/Equipo-IA-Windows-v4.5.0.zip

  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PowerShell syntax, argument transport and WinForms construction
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File windows\Test-Desktop.ps1
